# "v3.2" gibi bir etiket gönderilince APK'yı derler, imzalar ve GitHub sürümü olarak yayınlar.
# Telefondaki "Güncelle" butonu bu sürümlerin en sonuncusuna bakar.
#
# Gerekli depo sırları (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64  keystore/c2m.keystore dosyasının base64 hali
#   STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD  keystore.properties içindeki değerler
name: Sürüm yayınla

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: C2MKilit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Etiket versionName ile aynı mı
        run: |
          NAME=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)
          if [ "v$NAME" != "$GITHUB_REF_NAME" ]; then
            echo "Etiket $GITHUB_REF_NAME ama app/build.gradle'daki versionName $NAME"
            exit 1
          fi

      - name: İmza anahtarını yerleştir
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 sırrı eksik"; exit 1; fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/c2m.keystore
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Test ve derleme
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/release/app-release.apk "VOCD-$GITHUB_REF_NAME.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: C2MKilit/VOCD-${{ github.ref_name }}.apk
          generate_release_notes: true
